<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{../css/edit&formStyle.css}" />
<head th:replace="~{layout :: head(タスク編集)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <h3>タスク編集</h3>
    <form th:action="@{/todos/{id}/edit(id=${todo.id})}" th:object="${todo}" method="post">
        <div class>
            <label class="a1" for="task">タスク：</label>
            <input class="b1" type="text" id="task" name="task" th:field="*{task}" required>
        </div>
        <div class>
            <label class="a1" for="category">カテゴリー：</label>
            <input class="b1" type="text" id="category" name="category" th:field="*{category}" required>
        </div>
        <div>
            <label class="a1" for="deadline">締切日：</label>
            <input class="b1" type="date" id="deadline" name="deadline" th:field="*{deadline}" required>
        </div>
        <div>
            <label class="a1" for="place">場所：</label>
            <input class="b1" type="text" id="place" name="place" th:field="*{place}">
        </div>
        <div>
            <label class="a1" for="memo">メモ：</label>
            <textarea class="b1" type="text" id="memo" name="memo" th:field="*{memo}" rows="4" cols="50"></textarea>
        </div>
        <button type="submit">変更</button>
    </form>
    <div th:replace="~{layout :: footer}"></div>
</body>
