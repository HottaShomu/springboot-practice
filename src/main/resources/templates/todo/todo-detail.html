<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/detailStyle.css}" />
<head th:replace="~{layout :: head(タスク詳細)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <h3>タスク詳細</h3>
    <table>
        <tr class="task">
            <th>タスク名：</th>
            <td th:text="${todo.task}"></td>
        </tr>
        <tr class="category">
            <th>カテゴリー：</th>
            <td th:text="${todo.category}"></td>
        </tr>
        <tr class="deadline">
            <th>日付：</th>
            <td th:text="${todo.deadline}"></td>
        </tr>
        <tr class="place">
            <th>場所：</th>
            <td th:text="${todo.place}"></td>
        </tr>
        <tr class="memo">
            <th>メモ：</th>
            <td th:text="${todo.memo}"></td>
        </tr>
    </table>
    <form th:action="@{/todos/{id}/edit(id=${todo.id})}" method="get">
        <button type="submit">編集</button>
    </form>
</body>
</html>
