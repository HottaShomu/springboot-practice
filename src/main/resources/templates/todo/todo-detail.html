<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/detailStyle.css}" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.4/css/all.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
<head th:replace="~{layout :: head(タスク詳細)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <h3>タスク詳細<i class="fa-solid fa-file-invoice"></i></h3>
    <table>
        <tr>
            <th class="priority">優先度：</th>
            <td class="priorityDetail" th:if="${todo.priority == '高'}" th:text="${todo.priority}" style="color: red;"></td>
            <td class="priorityDetail" th:if="${todo.priority == '中'}" th:text="${todo.priority}" style="color: rgb(245, 157, 74);"></td>
            <td class="priorityDetail" th:if="${todo.priority == '低'}" th:text="${todo.priority}" style="color: blue;"></td>
            <td class="priorityDetail" th:text="${todo.priority}"></td>
        </tr>
        <tr>
            <th class="task">タスク名：</th>
            <td class="taskDetail" th:text="${todo.task}"></td>
        </tr>
        <tr>
            <th class="category">カテゴリー：</th>
            <td class="categoryDetail" th:text="${todo.category}"></td>
        </tr>
        <tr>
            <th class="deadline">日付：</th>
            <td class="deadlineDetail" th:text="${todo.deadline}"></td>
        </tr>
        <tr>
            <th class="">開始時間：</th>
            <td class="startTimeDetail" th:text="${todo.startTime}"></td>
        </tr>
        <tr>
            <th class="endTime">終了時間：</th>
            <td class="endTimeDetail" th:text="${todo.endTime}"></td>
        </tr>
        <tr>
            <th class="place">場所：</th>
            <td class="placeDetail" th:text="${todo.place}"></td>
        </tr>
        <tr>
            <th class="memo">メモ：</th>
            <td class="memoDetail">
                <pre th:text="${todo.memo}"></pre>
            </td>
        </tr>
    </table>
    <form th:action="@{/todos/{id}/edit(id=${todo.id})}" method="get">
        <button class="editButton" type="submit">編集</button>
    </form>
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
