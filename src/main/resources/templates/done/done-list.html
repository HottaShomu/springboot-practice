<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(完了タスク一覧)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <h3>完了タスク一覧</h3>    
    <table>
        <thead>
            <tr>
                <th>タスク</th>
                <th>締切日</th>
                <th>カテゴリー</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="todo : ${todos}" th:if="${todo.isTodoflag}">
                <td><span th:text="${todo.task}">task</span></td>
                <td><span th:text="${todo.deadline}">deadline</span></td>
                <td><span th:text="${todo.category}">category</span></td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
