<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(ログイン)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <div th:if="${param.error}" style="color:red">
        ユーザ名、またはパスワードが違います
    </div>
    <div th:if="${param.register}" style="color:blue">
        登録に成功しました
    </div>
    <form th:action="@{/login}" method="post">
        <div  class="username">
            <label for="username">ユーザ名：</label>
            <input type="text" id="username" name="username" placeholder="ユーザ名（例 comcom）" required>    
        </div>
        <div>
            <label for="password">パスワード：</label>
            <input type="password" id="password" name="password" placeholder="パスワード入力" required>
        </div>
        <button type="submit">ログイン</button>
    </form>
    
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
