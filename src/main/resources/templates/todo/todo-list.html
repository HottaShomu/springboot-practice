<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/listStyle.css}" />
<head th:replace="~{layout :: head(タスク一覧)}"></head>
<body>
    <div th:replace="~{layout :: header}"></div>
    <h3>タスク一覧</h3>
    <table>
        <thead>
            <tr>
                <th>タスク</th>
                <th>締切日</th>
                <th>カテゴリー</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="todo : ${todos}" th:unless="${todo.isTodoflag}">
                <td><a th:href="@{/todos/{id}(id=${todo.id})}"><span th:text="${todo.task}">task</span></a></td>
                <td><span th:text="${todo.deadline}">deadline</span></td>
                <td><span th:text="${todo.category}">category</span></td>
                <td class="tableButton">
                    <form th:action="@{/todos/{id}/edit(id=${todo.id})}" method="get">
                        <button type="submit">編集</button>
                    </form>
                </td>
                <td class="tableButton">
                    <form th:action="@{/todos/{id}/change/false(id=${todo.id}, isTodoflag=${todo.isTodoflag})}" method="post">
                        <button type="submit">完了</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{layout :: footer}"></div>
</body>
</html>
