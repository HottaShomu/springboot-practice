<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:fragment="head(title)">
        <meta charset=""UTF-8>
        <title th:text="${title}">Title</title>
    </head>
<body>
    <div th:fragment="header">
        <header>
            <h4>刻守</h4>
            <ul>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/todos}">タスク一覧</a></li>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/todos/Done}">完了タスク一覧</a></li>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/todos/new}">タスク登録</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/register}">新規登録</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">ログアウト</button>
                    </form>
                </li>
            </ul>
        </header>
    </div>

    <div th:fragment="footer">
        <footer style="background-color: #f8f8f8; text-align: center;">
            <a class="got" href="https://shinto-bukkyo.net/shinto/kamisama/%E3%82%A4%E3%82%B6%E3%83%8A%E3%83%9F%E3%83%8E%E3%83%9F%E3%82%B3%E3%83%88-%E4%BC%8A%E9%82%AA%E9%82%A3%E7%BE%8E%E5%91%BD/">
                &copy; 伊邪那美
            </a>
        </footer>
    </div>
</body>
</html>
